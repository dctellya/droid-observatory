[package]
name = "observatory-app"
description = "Tauri 2 shell of droid-observatory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "observatory_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2.12.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros"] }

# Declared ahead of host.rs (M2), the first tokio user; remove the entry with that module.
[package.metadata.cargo-machete]
ignored = ["tokio"]
