[package]
name = "observatory-app"
description = "Tauri 2 shell of droid-observatory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "observatory_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
observatory-core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros", "time", "sync", "io-util"] }
