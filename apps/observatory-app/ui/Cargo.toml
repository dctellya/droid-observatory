[package]
name = "observatory-ui"
description = "Leptos CSR UI of droid-observatory: renders what core view-models produce"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
observatory-core = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
# Already in Cargo.lock through leptos; named here to choose the web-sys features the file picker
# and the library storage use.
web-sys = { version = "0.3.106", features = [
    "Blob",
    "File",
    "FileList",
    "HtmlInputElement",
    "Performance",
    "PerformanceEntry",
    "PerformanceMark",
    "PerformanceMeasure",
    "Storage",
    "Window",
    "console",
] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
