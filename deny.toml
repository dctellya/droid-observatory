# cargo-deny configuration. Checked on every mission-branch push and on the gate PR.
# Policy source: ai/RULES.md rule 6 (advisories and licences).

[graph]
all-features = true
# The app ships for macOS only and its UI compiles to wasm. Linux-only GTK crates that Tauri
# pulls in on other targets are not part of anything shipped (D-011).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "wasm32-unknown-unknown"]

[advisories]
version = 2
yanked = "deny"
# paste is a proc-macro used at build time by Leptos; no safe upgrade exists (D-011).
ignore = [{ id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro in leptos, no upgrade available" }]

[licenses]
version = 2
# Apache-2.0 (this repository's licence) plus the permissive set the Rust ecosystem
# and Tauri depend on. Anything else fails the build until a decision file allows it.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "BSL-1.0", # xxhash-rust, via leptos server_fn (D-011)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
