# Release notes generated by GitHub from the PRs merged since the previous tag,
# grouped by this repository's labels (docs/decisions/D-009).
changelog:
  exclude:
    labels:
      - needs-triage
  categories:
    - title: Features
      labels:
        - type:feature
    - title: Fixes
      labels:
        - type:bug
        - fix-cycle
    - title: Security
      labels:
        - type:security
    - title: Decisions
      labels:
        - type:decision
    - title: Dependencies
      labels:
        - area:deps
    - title: Other
      labels:
        - "*"
