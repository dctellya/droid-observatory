# Price table used to turn tokens into money when the stream does not report credits
# (PRD §10.5). Dated: every cost shown by the observatory names the table it used.
#
# Prices are per million tokens, USD, standard (non-batch) API rates, 5-minute cache writes.
# Read from https://platform.claude.com/docs/en/about-claude/pricing on 2026-10-22
# (ai/RULES.md rule 3: verified, dated).
effective = "2026-10-22"
currency = "USD"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
verified = true

[models."claude-fable-5.1"]
role_default = "orchestrator"
input_per_m = 10.0
output_per_m = 50.0
cache_read_per_m = 0.25
cache_write_per_m = 12.5

[models."claude-opus-5-5"]
role_default = "validator"
input_per_m = 4.0
output_per_m = 20.0
cache_read_per_m = 0.20
cache_write_per_m = 5.0

[models."claude-sonnet-5-5"]
role_default = "worker"
input_per_m = 2.0
output_per_m = 10.0
cache_read_per_m = 0.10
cache_write_per_m = 2.5

[models."claude-haiku-4-5-20251001"]
input_per_m = 1.0
output_per_m = 5.0
cache_read_per_m = 0.10
cache_write_per_m = 1.25

# Cost multiplier per role (observatory metrics, architecture §9): cost = tokens x the model's rate x
# the role's multiplier. 1.0 for every role: the rates above are what a token of the role costs, no
# discount or surcharge is applied; a role missing here also counts as 1.0. Not a price: it is the
# one knob that lets the owner weight a role (for example a plan discount) without editing rates.
[roles]
orchestrator = 1.0
worker = 1.0
scrutiny_validator = 1.0
user_testing_validator = 1.0
