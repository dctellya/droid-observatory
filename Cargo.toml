[workspace]
resolver = "3"
members = [
  "crates/observatory-core",
  "crates/observatory-cli",
  "apps/observatory-app/src-tauri",
  "apps/observatory-app/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dctellya/droid-observatory"
publish = false

[workspace.dependencies]
observatory-core = { path = "crates/observatory-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
notify = "8.2.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
