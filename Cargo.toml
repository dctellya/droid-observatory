[workspace]
resolver = "3"
members = ["crates/observatory-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dctellya/droid-observatory"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
